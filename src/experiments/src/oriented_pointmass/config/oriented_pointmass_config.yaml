loop_frequency: 1000
publishers: 
  - target
  - pose

subscribers: []
callback_clients: 
  - apf_heuristic_force_client
  - velocity_heuristic_force_client
  - goalobstacle_heuristic_force_client

callback_servers: []

publisher:
  target:
    type: gafro_motor
    topic: target
    callback_queue: target
  pose:
    type: gafro_motor
    topic: pose
    callback_queue: pose
  best_agent_name:
    type: ros_string
    topic: best_agent_name
    callback_queue: best_agent_name


callback_client:
  apf_heuristic_force_client:
    type: apf_heuristic_force
    callback_request: get_apf_heuristic_force
    callback_response: apf_force_response
    timeout: 10
  velocity_heuristic_force_client:
    type: velocity_heuristic_force
    callback_request: get_velocity_heuristic_force
    callback_response: goal_force_response
    timeout: 10
  goalobstacle_heuristic_force_client:
    type: goalobstacle_heuristic_force
    callback_request: get_goalobstacle_heuristic_force
    callback_response: goal_force_response
    timeout: 10

cf_planner:
  n_agents: 3
  agent_type: pointmass
  delta_t: 0.01
  max_prediction_steps: 1000
  planning_frequency: 100
  prediction_freq_multiple: 1
  approach_distance: 0.25
  agent_switch_factor: 0.9
  costs: 
    - path_length_cost
    - goal_distance_cost
  path_length_cost:
    weight: 1.0
  goal_distance_cost:
    weight: 1.0

  agent_1:
    mass: 0.1
    radius: 0.1
    max_velocity: 0.1
    approach_distance: 0.25
    forces:
      - attractor_force
      - apf_heuristic_force
    attractor_force: 
      k_gain: 1.0
      k_stiffness_linear: 1.0
      k_stiffness_angular: 0.01
      k_damping_linear: 4.0
      k_damping_angular: 0.04
    apf_heuristic_force:
      k_gain: 1.0
      k_force: 1.0
      detect_shell_radius: 5.0
      max_allowable_force: 20.0

  agent_2:
    mass: 1.0
    radius: 0.1
    max_velocity: 0.1
    approach_distance: 0.25
    forces:
      - attractor_force
      - velocity_heuristic_force
    attractor_force: 
      k_gain: 0.25
      k_stiffness_linear: 1.2
      k_stiffness_angular: 0.01
      k_damping_linear: 7.5
      k_damping_angular: 0.04
    velocity_heuristic_force:
      k_gain: 1.0
      k_force: 0.5
      detect_shell_radius: 0.25
      max_allowable_force: 20.0

  agent_3:
    mass: 0.1
    radius: 0.1
    max_velocity: 0.1
    approach_distance: 0.25
    forces:
      - attractor_force
      - goalobstacle_heuristic_force
    attractor_force: 
      k_gain: 1.0
      k_stiffness_linear: 1.0
      k_stiffness_angular: 0.01
      k_damping_linear: 4.0
      k_damping_angular: 0.04
    goalobstacle_heuristic_force:
      k_gain: 1.0
      k_force: 0.005
      detect_shell_radius: 0.50
      max_allowable_force: 20.0
