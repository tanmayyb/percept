loop_frequency: 10000
publishers:
- target
- pose
- robot
subscribers: []
callback_clients:
- obstacle_distance_cost_client
- velocity_heuristic_force
- apf_heuristic_force
- goal_heuristic_force
- obstacle_heuristic_force
- random_heuristic_force
callback_servers:
- set_goal_server
publisher:
  target:
    type: gafro_motor
    topic: target
    callback_queue: target
  pose:
    type: gafro_motor
    topic: pose
    callback_queue: pose
  robot:
    type: gafro_system
    description: robots/panda/panda.yaml
    topic: robot
    callback_queue: robot
    frame: world
    color:
      r: 0.0
      g: 0.0
      b: 0.0
      a: 0.0
callback_client:
  obstacle_distance_cost_client:
    type: obstacle_distance_cost
    callback_request: get_min_obstacle_distance
    callback_response: obstacle_distance_response
    timeout: 10
  velocity_heuristic_force:
    type: velocity_heuristic_force
    callback_request: get_velocity_heuristic_force
    callback_response: velocity_heuristic_force_response
    timeout: 10
  apf_heuristic_force:
    type: apf_heuristic_force
    callback_request: get_apf_heuristic_force
    callback_response: apf_heuristic_force_response
    timeout: 10
  goal_heuristic_force:
    type: goal_heuristic_force
    callback_request: get_goal_heuristic_force
    callback_response: goal_heuristic_force_response
    timeout: 10
  obstacle_heuristic_force:
    type: obstacle_heuristic_force
    callback_request: get_obstacle_heuristic_force
    callback_response: obstacle_heuristic_force_response
    timeout: 10
  random_heuristic_force:
    type: random_heuristic_force
    callback_request: get_random_heuristic_force
    callback_response: random_heuristic_force_response
    timeout: 10
cf_planner:
  n_agents: 10
  agent_type: manipulator
  delta_t: 0.01
  max_prediction_steps: 75
  planning_frequency: 100
  agent_switch_factor: 0.95
  costs:
  - goal_distance_cost
  - obstacle_distance_cost
  - path_length_cost
  - trajectory_smoothness_cost
  goal_distance_cost:
    weight: 20.0
    radius: 0.05
  obstacle_distance_cost:
    weight: 2.0
    radius: 0.4
  path_length_cost:
    weight: 1.0
  trajectory_smoothness_cost:
    weight: 1.0
  agent_1:
    mass: 1.0
    radius: 0.01
    forces:
    - attractor_force
    - velocity_heuristic_force
    attractor_force:
      k_gain: 1.0
      k_stiffness_linear: 1.0
      k_stiffness_angular: 0.01
      k_damping_linear: 2.5
      k_damping_angular: 0.01
    velocity_heuristic_force:
      k_gain: 1.0
      k_force: 0.0001
      detect_shell_radius: 0.3
      max_allowable_force: 20.0
  agent_2:
    mass: 1.0
    radius: 0.01
    forces:
    - attractor_force
    - velocity_heuristic_force
    attractor_force:
